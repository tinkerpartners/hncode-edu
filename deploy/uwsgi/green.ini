[uwsgi]
uwsgi-socket = /tmp/green.sock
chmod-socket = 777
pidfile = /tmp/green.pid
chdir = /root/green-oj
pythonpath = /root/green-oj
virtualenv = /root/green-oj/.venv
protocol = uwsgi
master = true
plugins = python3
env = DJANGO_SETTINGS_MODULE=dmoj.settings
module = dmoj.wsgi:application
optimize = 2
processes = 4
memory-report = true
harakiri = 60
