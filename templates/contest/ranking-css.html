{% if has_rating %}
  <style>
    .contest-ranking-page #users-table .rate-box {
      font-size: 0.85em;
      float: left;
    }

    .contest-ranking-page #users-table td:nth-child(1) .rating {
      margin-left: 1.25em;
      display: block;
    }

    .contest-ranking-page #users-table td:nth-child(2) a {
      display: block;
    }
  </style>
{% endif %}
<style>
  #ranking-feedback:empty { display: none; }
  #ranking-feedback { padding: 5px 0; font-size: 12px; }
  #ranking-feedback.is-error { color: #c43b3b; }
  .ranking-empty td { text-align: center; padding: 24px 10px; }
  .ranking-empty p { margin: 0 0 8px; }
</style>
