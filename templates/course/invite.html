{% extends "base.html" %}
{% set title = _('Course invitation') %}

{% block body %}
  <section class="content-description">
    <h2>{{ _('Course invitation') }}</h2>
    <p>{{ _('You are invited to join as a student:') }} <strong>{{ invite_course.name }}</strong></p>
    <form method="post">
      {% csrf_token %}
      <button class="action-btn" type="submit">{{ _('Join course') }}</button>
      <a href="{{ url('course_list') }}">{{ _('Back to courses') }}</a>
    </form>
  </section>
{% endblock %}
