<form action="{{ url('contest_leave', participation.contest.key) }}" method="post"
      onsubmit="return confirm('{{ _('End this attempt and return to the paper? Your submissions are kept.')|escapejs }}');">
  {% csrf_token %}
  <input name="library_mock_session" type="hidden" value="{{ participation.id }}">
  <button class="{{ leave_button_class }}" type="submit">{{ _('Leave contest') }}</button>
</form>
