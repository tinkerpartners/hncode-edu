<style>
  #content { width: 96%; box-sizing: border-box; }
  #content-body { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 12px; align-items: start; }
  #content-body:has(> .left-sidebar.is-collapsed) { grid-template-columns: 64px minmax(0, 1fr); }
  #content-body > .left-sidebar {
    position: sticky; top: 64px; width: 100%; min-width: 0; max-width: 100%;
    height: auto; max-height: calc(100vh - 80px); overflow-y: auto;
    box-sizing: border-box; margin: 0; padding: 6px;
    border: 1px solid var(--hn-border); border-radius: 8px;
    background: var(--hn-raised); scrollbar-width: thin;
  }
  #content-body > .left-sidebar.is-collapsed .hn-rail-name,
  #content-body > .left-sidebar.is-collapsed .hn-rail-score,
  #content-body > .left-sidebar.is-collapsed .hn-rail-caption { display: none; }
  .hn-rail-header { display: flex; align-items: center; gap: 4px; padding-bottom: 3px; }
  .hn-rail-header .hn-rail-back { flex: 1; min-width: 0; }
  .hn-rail-toggle { display: inline-flex; flex: none; width: 26px; height: 26px; justify-content: center; align-items: center; padding: 0; cursor: pointer; color: var(--hn-muted); background: transparent; border: 1px solid var(--hn-border); border-radius: 5px; font: inherit; font-size: 11px; }
  .hn-rail-toggle:hover { color: var(--hn-brand); background: var(--hn-neutral-bg); }
  .hn-rail-toggle:focus-visible { outline: 2px solid var(--hn-brand); outline-offset: -2px; }
  .left-sidebar.is-collapsed .hn-rail-header { flex-direction: column-reverse; }
  .left-sidebar.is-collapsed .hn-rail-chevron { transform: rotate(180deg); }
  .hn-rail-items { display: grid; gap: 5px; padding: 2px; }
  #content-body > .left-sidebar .left-sidebar-item {
    display: grid; grid-template-columns: 18px 10px minmax(0, 1fr) auto; align-items: center; gap: 4px;
    min-width: 0; width: auto; margin: 0; padding: 0 5px; min-height: 32px; height: 32px;
    box-sizing: border-box; flex: none; font-size: 12px; box-shadow: none;
  }
  #content-body > .left-sidebar.is-collapsed .left-sidebar-item { display: inline-flex; justify-content: center; padding: 0 5px; height: 34px; min-height: 34px; }
  .hn-rail-name { grid-column: 3; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.4; }
  .hn-rail-score { grid-column: 4; white-space: nowrap; font-size: 11px; font-variant-numeric: tabular-nums; }
  #content-body > .left-sidebar .left-sidebar-item.active { outline: 2px solid var(--hn-brand); outline-offset: 1px; }
  #content-body > .left-sidebar .hn-pchip { background: var(--hn-surface); color: var(--hn-text); border: 1px solid var(--hn-border); border-radius: 6px; }
  #content-body > .left-sidebar .hn-pchip.is-ok { background: var(--hn-ok-bg); color: var(--hn-ok); border-color: var(--hn-ok); }
  #content-body > .left-sidebar .hn-pchip.is-bad { background: var(--hn-bad-bg); color: var(--hn-bad); border-color: var(--hn-bad); }
  #content-body > .left-sidebar .hn-pchip.is-partial { background: var(--hn-partial-bg); color: var(--hn-partial); border-color: var(--hn-partial); }
  #content-body > .left-sidebar .hn-pchip.is-hidden { border-style: dashed; color: var(--hn-muted); }
  .hn-rail-back { display: flex; align-items: center; gap: 6px; padding: 6px 4px; color: var(--hn-muted); border-radius: 5px; font-size: 12px; }
  .hn-rail-back .hn-rail-caption { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .is-collapsed .hn-rail-back { justify-content: center; }
  .hn-rail-back:hover { background: var(--hn-neutral-bg); }
  @media (max-width: 1100px) {
    #content-body { grid-template-columns: 200px minmax(0, 1fr); }
    #content-body:has(> .left-sidebar) #common-content.hn-problem-detail { display: flex; flex-direction: column; gap: 14px; }
    #content-body:has(> .left-sidebar) .hn-problem-detail #content-left { order: 0; width: 100%; }
    #content-body:has(> .left-sidebar) .hn-problem-detail #content-right { order: 1; position: static; width: 100%; }
  }
  @media (max-width: 600px) {
    #content { width: 98%; padding: 10px; }
    #content-body { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    #content-body:has(> .left-sidebar.is-collapsed) { grid-template-columns: 48px minmax(0, 1fr); }
    #content-body > .left-sidebar { padding: 3px; position: static; max-height: 240px; }
    #content-body > .left-sidebar.is-collapsed { position: sticky; top: 44px; max-height: calc(100vh - 60px); }
    #content-body > .left-sidebar .left-sidebar-item { gap: 3px; font-size: 12px; }
    #content-body > .left-sidebar.is-collapsed .left-sidebar-item { padding: 0 2px; }
  }
</style>
