{# Blog post in the mixed feed — reuses shared post inner component #}
{% set post = item.data %}
<article class="{% if post.sticky %}sticky {% endif %}{{ feed_card_class }}">
  {% with blog_cards=article_cards, feed_preview_id='feed-post-preview-' ~ post.id %}
    {% include "home/feed-post-inner.html" %}
  {% endwith %}
</article>
