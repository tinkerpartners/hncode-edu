{# Recommended problem — reuses shared problem card with reason line #}
{% set problem = item.data %}
<article class="{{ feed_card_class }}">
  <div class="feed-comment-reason">
    {{ _('Recommended for you') }}
  </div>
  {% with feed_preview_id=('problem-preview-' ~ problem.id) if article_cards else None %}
    {% include "problem/feed/item.html" %}
  {% endwith %}
</article>
