{% macro feed_preview(preview_id=None) %}
  {% if preview_id %}<div class="home-news-reading-content">{% endif %}
  <div {% if preview_id %}class="home-news-preview" id="{{ preview_id }}" data-article-preview{% else %}class="blog-description"{% endif %}>
    <div class="summary content-description">
      {{ caller() }}
    </div>
    {% if not preview_id %}<div class="show-more">{{ _('...More') }}</div>{% endif %}
  </div>
  {% if preview_id %}
    <button class="home-news-toggle" type="button" data-article-toggle
            aria-controls="{{ preview_id }}" aria-expanded="false" hidden>
      <span class="sr-only home-news-expand-label">{{ _('Show more') }}</span>
      <span class="sr-only home-news-collapse-label">{{ _('Collapse') }}</span>
      <span class="home-news-toggle-icons" aria-hidden="true">
        <i class="fa fa-chevron-down"></i>
        <i class="fa fa-chevron-down"></i>
        <i class="fa fa-chevron-down"></i>
      </span>
    </button>
    </div>
  {% endif %}
{% endmacro %}
