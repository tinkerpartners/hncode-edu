{# Recommended contest — reuses shared contest card with reason line #}
{% set contest = item.data %}
<article class="{{ feed_card_class }}">
  <div class="feed-comment-reason">
    {{ _('Recommended for you') }}
  </div>
  {% with feed_preview_id=('contest-preview-' ~ contest.id) if article_cards else None %}
    {% include "contest/feed/item.html" %}
  {% endwith %}
</article>
