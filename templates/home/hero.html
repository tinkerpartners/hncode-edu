{% if home_hero %}
  <style>
    .home-hero {
      margin-bottom: 16px;
    }

    .home-hero-banner {
      padding: 40px 16px;
      text-align: center;
    }

    .home-hero-banner-text {
      max-width: 900px;
      margin: 0 auto;
      font-size: 1.15em;
    }

    .home-hero-banner-text h1,
    .home-hero-banner-text h2,
    .home-hero-banner-text h3,
    .home-hero-banner-text p {
      color: inherit;
      border: none;
    }

    .home-hero-banner-text h1 {
      font-size: 2em;
      margin: 0 0 0.3em;
    }

    .home-hero-banner-text p {
      margin: 0.4em 0;
    }

    .home-hero-banner-text > :first-child {
      margin-top: 0;
    }

    .home-hero-banner-text > :last-child {
      margin-bottom: 0;
    }

    .home-hero-banner-text a {
      color: inherit;
      text-decoration: underline;
    }

    .home-hero-image {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: cover;
    }

    @media (max-width: 799px) {
      .home-hero-banner {
        padding: 24px 12px;
      }

      .home-hero-image {
        max-height: 220px;
      }
    }
  </style>
  <section class="home-hero">
    <div class="home-hero-banner" style="background-color: {{ home_hero.background_color }}; color: {{ home_hero.text_color }};">
      {% if home_hero.text %}
        <div class="home-hero-banner-text">
          {{ home_hero.text|markdown|str|safe }}
        </div>
      {% endif %}
    </div>
    {% if home_hero.image_url %}
      <img class="home-hero-image" src="{{ home_hero.image_url }}" alt="">
    {% endif %}
  </section>
{% endif %}
