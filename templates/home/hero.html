{% if home_hero %}
  <style>
    .home-hero {
      margin-bottom: 16px;
    }

    /* Match the column area: .middle-right-content(.no-left-sidebar) spans
       2%..98% of the page on desktop. */
    @media (min-width: 800px) {
      .home-hero {
        margin-left: 2%;
        margin-right: 2%;
      }
    }

    .home-hero-banner {
      padding: 10px;
      text-align: left;
    }

    .home-hero-banner-text {
      font-size: 2em;
    }

    /* Full width, full natural height — never cropped or capped. */
    .home-hero-image {
      display: block;
      width: 100%;
      height: auto;
    }

  </style>
  <section class="home-hero">
    <div class="home-hero-banner" style="background-color: {{ home_hero.background_color }}; color: {{ home_hero.text_color }};">
      {% if home_hero.text %}
        <div class="home-hero-banner-text">
          {{ home_hero.text }}
        </div>
      {% endif %}
    </div>
    {% if home_hero.image_url %}
      <img class="home-hero-image" src="{{ home_hero.image_url }}" alt="">
    {% endif %}
  </section>
{% endif %}
